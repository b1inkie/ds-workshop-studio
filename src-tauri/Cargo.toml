[package]
name = "ds-workshop-tool"
version = "0.2.1"
description = "Don't Starve Workshop Studio"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tempfile = "3"
sha2 = "0.10"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
semver = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
